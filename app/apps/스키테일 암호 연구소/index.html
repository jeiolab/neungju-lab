    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Noto Serif KR"', 'Cinzel', 'serif'],
              sans: ['"Noto Sans KR"', 'Inter', 'sans-serif'],
            },
            colors: {
              greece: {
                blue: '#0057B7',
                gold: '#C5A059',
                cream: '#F5F5F0',
                clay: '#B85C38',
                stone: '#2D3748'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F5F5F0;
        word-break: keep-all; /* Improve Korean line breaking */

        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F5F5F0; 
      }
      ::-webkit-scrollbar-thumb {
        background: #C5A059; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B85C38; 
      }
    </style>

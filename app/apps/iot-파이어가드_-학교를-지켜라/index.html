    <style>
      body {
        font-family: 'Noto Sans KR', sans-serif;
      }
      .animate-pulse-fast {
        animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
      .siren-light {
        box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.7);
        animation: flash 1s infinite alternate;
      }
      @keyframes flash {
        from { box-shadow: 0 0 10px 2px rgba(239, 68, 68, 0.3); }
        to { box-shadow: 0 0 40px 20px rgba(239, 68, 68, 0.9); }
      }
    </style>
